<!doctype html><html><head><meta charset="utf-8"><style>
:root{--w:300px;--h:400px}
*{margin:0;padding:0;box-sizing:border-box}
body{width:var(--w);height:var(--h);background:#F2ECE3;font-family:Inter,sans-serif;color:#2B2A28;overflow:hidden}
.p{position:relative;width:100%;height:100%;display:flex;flex-direction:column;align-items:center}
svg.art{margin-top:calc(var(--h)*0.08);width:58%}
h1{font-weight:200;font-size:calc(var(--w)*0.135);letter-spacing:-0.02em;margin-top:calc(var(--h)*0.05);line-height:1}
.row{display:flex;align-items:center;gap:calc(var(--w)*0.03);margin-top:calc(var(--h)*0.03)}
.lbl{font-weight:500;font-size:calc(var(--w)*0.032);letter-spacing:0.3em}
.tg{width:calc(var(--w)*0.13);height:calc(var(--w)*0.07);border-radius:999px;background:#C8603F;position:relative}
.tg i{position:absolute;right:calc(var(--w)*0.008);top:calc(var(--w)*0.008);width:calc(var(--w)*0.054);height:calc(var(--w)*0.054);border-radius:50%;background:#F2ECE3}
.cap{position:absolute;bottom:calc(var(--h)*0.06);font-size:calc(var(--w)*0.026);letter-spacing:0.35em;font-weight:400;color:#6E665C}
</style></head><body><div class="p">
<svg class="art" viewBox="0 0 200 240">
 <defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
   <stop offset="0" stop-color="#E9B8A0"/><stop offset=".55" stop-color="#E3967A"/><stop offset="1" stop-color="#C8603F"/>
  </linearGradient>
  <clipPath id="arch"><path d="M10 240 V100 A90 90 0 0 1 190 100 V240 Z"/></clipPath>
 </defs>
 <path d="M10 240 V100 A90 90 0 0 1 190 100 V240 Z" fill="url(#sky)"/>
 <g clip-path="url(#arch)">
  <circle cx="100" cy="175" r="38" fill="#F6D3B8"/>
  <path d="M0 200 Q40 188 80 198 T160 194 T220 198 V240 H0Z" fill="#F2ECE3" opacity=".55"/>
  <path d="M0 214 Q50 204 100 214 T220 210 V240 H0Z" fill="#F2ECE3" opacity=".8"/>
  <path d="M0 228 Q60 220 120 228 T220 226 V240 H0Z" fill="#F2ECE3"/>
  <path d="M22 150 Q70 120 128 78" fill="none" stroke="#F2ECE3" stroke-width="1.6" stroke-dasharray="3 4" stroke-linecap="round"/>
 </g>
 <rect x="0" y="229" width="200" height="12" fill="#F2ECE3"/>
 <!-- airplane -->
 <g transform="translate(140 68) rotate(-40) scale(1.25)" fill="#F2ECE3">
  <path d="M-16 0 Q-16 -2.6 -12 -2.6 L10 -2.6 Q16 -2.6 18 0 Q16 2.6 10 2.6 L-12 2.6 Q-16 2.6 -16 0Z"/>
  <path d="M-2 -2.4 L-8 -16 L-4 -16 L6 -2.4Z"/>
  <path d="M-2 2.4 L-8 16 L-4 16 L6 2.4Z"/>
  <path d="M-13 -2 L-17 -8 L-14.5 -8 L-9 -2Z"/>
  <path d="M-13 2 L-17 8 L-14.5 8 L-9 2Z"/>
 </g>
</svg>
<h1>flight mode</h1>
<div class="row"><span class="lbl">ON</span><span class="tg"><i></i></span></div>
<div class="cap">DISCONNECT TO RECONNECT</div>
</div></body></html>
