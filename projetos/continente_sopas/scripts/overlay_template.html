<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Vlog Noite — textos</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Pinyon Script"; src: url("fonts/PinyonScript-Regular.ttf"); font-weight: 400; }
      @font-face { font-family: "Cormorant Garamond"; src: url("fonts/CormorantGaramond-Medium.ttf"); font-weight: 500; }
      @font-face { font-family: "Cormorant Garamond"; src: url("fonts/CormorantGaramond-SemiBold.ttf"); font-weight: 600; }
      @font-face { font-family: "Space Mono"; src: url("fonts/SpaceMono-Regular.ttf"); font-weight: 400; }
      @font-face { font-family: "Poppins"; src: url("fonts/Poppins-Medium.ttf"); font-weight: 500; }
      @font-face { font-family: "Poppins"; src: url("fonts/Poppins-SemiBold.ttf"); font-weight: 600; }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; color: #fff; }

      .clip { position: absolute; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; text-align: center; }
      .soft { text-shadow: 0 0 22px rgba(0, 0, 0, 0.45), 0 2px 8px rgba(0, 0, 0, 0.35), 0 1px 2px rgba(0, 0, 0, 0.4); }

      /* Publicidade */
      #ad { top: 170px; }
      #ad span { font-family: "Poppins"; font-weight: 500; font-size: 28px; letter-spacing: 0.08em; opacity: 0.9; }

      /* Título da série */
      #title { top: 760px; }
      #title .script { font-family: "Pinyon Script"; font-size: 210px; line-height: 1; color: #f3e3a3; }
      #title .caps { font-family: "Cormorant Garamond"; font-weight: 600; font-size: 42px; letter-spacing: 0.01em; margin-top: 6px; }
      #title .sub { font-family: "Cormorant Garamond"; font-weight: 500; font-size: 36px; margin-top: 4px; opacity: 0.95; }

      /* Etiquetas hora + atividade */
      .label { top: 400px; }
      .label .time { font-family: "Space Mono"; font-size: 40px; line-height: 1.1; }
      .label .what { font-family: "Poppins"; font-weight: 600; font-size: 46px; line-height: 1.15; }

      /* Produto */
      #product { top: 360px; }
      #product-card { display: flex; flex-direction: column; align-items: center; padding: 22px 40px 24px; border-radius: 30px; background: rgba(38, 28, 20, 0.42); }
      #product .name { font-family: "Cormorant Garamond"; font-weight: 600; font-size: 66px; line-height: 1.05; color: #f3e3a3; }
      #product .desc { font-family: "Poppins"; font-weight: 500; font-size: 32px; margin-top: 8px; }

      /* Fecho (por baixo da embalagem) */
      #end-shade { top: 0; bottom: 0; }
      .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0) 55%, rgba(0,0,0,0.5) 72%, rgba(0,0,0,0.15) 92%); }
      #end { top: 1330px; }
      #end .script { font-family: "Pinyon Script"; font-size: 120px; line-height: 1.1; color: #f3e3a3; }
      #end .caps { font-family: "Cormorant Garamond"; font-weight: 600; font-size: 50px; letter-spacing: 0.04em; margin-top: 6px; }
      #end .brand { font-family: "Poppins"; font-weight: 500; font-size: 32px; letter-spacing: 0.06em; margin-top: 4px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="%%DURATION%%" data-width="1080" data-height="1920">
      %%CLIPS%%
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      const ease = "power2.out";
      // aparecer suave (subir 14px + fade), sair só com fade
      function show(sel, start, end, d = 0.5) {
        tl.fromTo(sel, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: d, ease }, start);
        tl.to(sel, { opacity: 0, duration: 0.35, ease: "power1.in" }, end - 0.35);
      }
%%JS%%
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
