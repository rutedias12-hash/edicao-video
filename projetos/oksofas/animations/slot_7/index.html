<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>OK Sofás — cartão final</title>
    <script src="vendor/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "DM Serif Display";
        font-style: normal;
        font-weight: 400;
        font-display: block;
        src: url("fonts/DMSerifDisplay-Regular-latin.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: transparent;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }
      #card {
        position: absolute;
        inset: 0;
      }
      #panel {
        position: absolute;
        inset: 0;
        background: #f4efe8;
      }
      .line {
        position: absolute;
        left: 0;
        right: 0;
        text-align: center;
        font-family: "DM Serif Display", serif;
        font-weight: 400;
        white-space: nowrap;
      }
      #q {
        top: 790px;
        font-size: 84px;
        line-height: 100px;
        color: #2b2420;
      }
      #a {
        top: 905px;
        font-size: 130px;
        line-height: 150px;
        color: #d6342a;
        letter-spacing: -0.005em;
      }
      #rule {
        position: absolute;
        left: 480px;
        top: 1100px;
        width: 120px;
        height: 2px;
        background: #cdbba3;
      }
      #logo {
        position: absolute;
        left: 260px;
        top: 1150px;
        width: 560px;
        height: 150px;
        display: block;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="slot_7"
      data-start="0"
      data-duration="2.5"
      data-fps="30"
      data-width="1080"
      data-height="1920"
    >
      <div id="card">
        <div id="panel" data-layout-allow-overflow></div>
        <div id="q" class="line">6 meses depois?</div>
        <div id="a" class="line">Aconselhamos.</div>
        <div id="rule"></div>
        <img id="logo" src="logo_red.png" alt="OK Sofás" />
      </div>
    </div>
    <script>
      (async () => {
        const FONT = '400 84px "DM Serif Display"';
        await document.fonts.load(FONT, "6 meses depois? Aconselhamos.");
        await document.fonts.ready;
        if (!document.fonts.check(FONT, "Aconselhamos.")) {
          throw new Error("DM Serif Display não carregou — render abortado");
        }

        const tl = gsap.timeline({ paused: true });
        // 0 → 0.35: painel creme sobe de baixo e cobre o ecrã todo
        tl.fromTo("#panel", { yPercent: 100 }, { yPercent: 0, duration: 0.35, ease: "power2.inOut" }, 0);
        // 0.35 → 0.65: pergunta
        tl.fromTo("#q", { opacity: 0, y: 28 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 0.35);
        // 0.75 → 1.0: resposta
        tl.fromTo("#a", { opacity: 0, y: 40, scale: 0.97 }, { opacity: 1, y: 0, scale: 1, duration: 0.25, ease: "power3.out" }, 0.75);
        // 1.0 → 1.3: filete
        tl.fromTo("#rule", { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.3, ease: "power2.out" }, 1.0);
        // 1.15 → 1.45: logótipo
        tl.fromTo("#logo", { opacity: 0, scale: 0.96 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power2.out" }, 1.15);
        // mantém até 2.5 s, sem saída
        tl.set({}, {}, 2.5);

        window.__timelines["slot_7"] = tl;
        tl.seek(0);
      })();
    </script>
  </body>
</html>
